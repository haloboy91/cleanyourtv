name: Download CleanYourTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/download-apk.yml

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 095b71ad93d99ea28d94d97b06385709d354b795
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Build and test release
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp launcher/app/build/outputs/apk/release/app-release.apk artifact/CleanYourTV-3.1-release.apk
          apk=artifact/CleanYourTV-3.1-release.apk
          bt="$ANDROID_HOME/build-tools/34.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee artifact/signature.txt
          "$bt/zipalign" -c -v 4 "$apk" > artifact/alignment.txt
          "$bt/aapt" dump badging "$apk" > artifact/package-details.txt
          test "$(stat -c %s "$apk")" -lt 589824
          (cd artifact && sha256sum CleanYourTV-3.1-release.apk > SHA256SUMS.txt)
          echo "Source commit: $(git rev-parse HEAD)" > artifact/BUILD-NOTES.txt
          echo "Release variant signed with Android debug key per repository configuration. Not an official publisher-signed release. Android 8.0+ required. No device connection or installation performed." >> artifact/BUILD-NOTES.txt
          echo "Windows verification: Get-FileHash .\\CleanYourTV-3.1-release.apk -Algorithm SHA256" >> artifact/BUILD-NOTES.txt
          cp launcher/app/build/reports/lint-results-release.html artifact/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CleanYourTV-3.1-release
          path: artifact/
          if-no-files-found: error
          retention-days: 30
